<?xml version="1.0" encoding="UTF-8"?>
<!-- NegConv macOS app icon, 1024x1024 canvas, Apple grid: 824x824 tile at (100,100). -->
<svg width="1024" height="1024" viewBox="0 0 1024 1024" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="lightbox" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBFBF8"/>
      <stop offset="1" stop-color="#D9D9D4"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="10" result="b"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="tile">
      <rect x="100" y="100" width="824" height="824" rx="185" ry="185"/>
    </clipPath>
    <path id="hole" d="M-24,-12 a12,12 0 0 1 12,-12 h24 a12,12 0 0 1 12,12 v24 a12,12 0 0 1 -12,12 h-24 a12,12 0 0 1 -12,-12 z" fill="url(#lightbox)"/>
  </defs>

  <!-- tile -->
  <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#lightbox)" filter="url(#shadow)"/>

  <g clip-path="url(#tile)">
    <!-- film strip, full bleed across the tile -->
    <rect x="80" y="262" width="864" height="500" fill="#000"/>

    <!-- sprocket holes, centred on x=512, pitch 91 -->
    <g id="row">
      <use href="#hole" x="57"  y="308"/>
      <use href="#hole" x="148" y="308"/>
      <use href="#hole" x="239" y="308"/>
      <use href="#hole" x="330" y="308"/>
      <use href="#hole" x="421" y="308"/>
      <use href="#hole" x="512" y="308"/>
      <use href="#hole" x="603" y="308"/>
      <use href="#hole" x="694" y="308"/>
      <use href="#hole" x="785" y="308"/>
      <use href="#hole" x="876" y="308"/>
      <use href="#hole" x="967" y="308"/>
    </g>
    <use href="#row" y="408"/>

    <!-- frame: orange mask (negative) / light (positive) split on the diagonal -->
    <rect x="257" y="347" width="510" height="330" fill="#F2F2EF"/>
    <path d="M257,347 L767,347 L257,677 Z" fill="#E6611A"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
